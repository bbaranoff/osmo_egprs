; pjsip.conf — Configuration PJSIP Asterisk
;
; Contient :
;  - Transports UDP/TCP
;  - Endpoints locaux (Linphone softphones)
;  - Trunks inter-opérateurs

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
allow_reload=yes

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5061
allow_reload=yes

; ═════════════════════════════════════════════════════════════════════════════
; Endpoints Locaux — Softphones (Linphone A, B, C)
; ═════════════════════════════════════════════════════════════════════════════

[linphone_A]
type=endpoint
context=default
transport=transport-udp
disallow=all
allow=gsm
allow=ulaw
allow=alaw
aors=linphone_A
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[linphone_A]
type=aor
contact=sip:linphone_a@127.0.0.1:5064
qualify_frequency=15
max_contacts=1

[linphone_B]
type=endpoint
context=default
transport=transport-udp
disallow=all
allow=gsm
allow=ulaw
allow=alaw
aors=linphone_B
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[linphone_B]
type=aor
contact=sip:linphone_b@127.0.0.1:5065
qualify_frequency=15
max_contacts=1

[linphone_C]
type=endpoint
context=default
transport=transport-udp
disallow=all
allow=gsm
allow=ulaw
allow=alaw
aors=linphone_C
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[linphone_C]
type=aor
contact=sip:linphone_c@127.0.0.1:5066
qualify_frequency=15
max_contacts=1

; ═════════════════════════════════════════════════════════════════════════════
; Endpoint Interne — GSM MSC (échange avec proto-smsc/MSC)
; ═════════════════════════════════════════════════════════════════════════════

[gsm_msc]
type=endpoint
context=interop_in
transport=transport-udp
disallow=all
allow=gsm
allow=ulaw
allow=alaw
aors=gsm_msc
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[gsm_msc]
type=aor
contact=sip:proto_smsc_msc@127.0.0.1:5080
qualify_frequency=30
max_contacts=1

; ═════════════════════════════════════════════════════════════════════════════
; Trunks Inter-Opérateurs
; 
; Appels de/vers autres opérateurs via SIP
; Format : SIP/trunk_opX à destination du SIP de l'autre op
; ═════════════════════════════════════════════════════════════════════════════

; Trunk vers Op1 (si cet opérateur n'est pas Op1)
[interop-identify-op1]
type=identify
endpoint=interop_trunk_op1
match=172.20.0.11

[interop_trunk_op1]
type=endpoint
transport=transport-udp
context=interop_in
disallow=all
allow=gsm
allow=ulaw
allow=alaw
aors=interop_trunk_op1
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
from_user=interop_op__OPERATOR_ID__

[interop_trunk_op1]
type=aor
contact=sip:172.20.0.11:5060
qualify_frequency=15
qualify_timeout=5.0
max_contacts=1

