; extensions.conf — Dialplan inter-opérateurs Asterisk
;
; [interop_in]  — Appels entrants de SIP (autre opérateur)
; [interop_out] — Appels sortants vers autre opérateur
; [gsm_in]      — Appels GSM (optionnel, simplifié)
;
; Placeholders :
;   __OP_NAME__   — Nom opérateur
;   __OPERATOR_ID__ — ID (1, 2, 3…)

[general]
static=yes
writeprotect=yes
autofallthrough=yes

; ═════════════════════════════════════════════════════════════════════════════
; [interop_in] — Appels entrants du SIP (autre opérateur)
; ═════════════════════════════════════════════════════════════════════════════

[interop_in]
; Appels entrants depuis autre opérateur via SIP trunk inter-op
; Format : SIP/interop_trunk_opN@IP:port

exten => _X.,1,NoOp(=== INTEROP IN: ${EXTEN} from ${CHANNEL} ===)
 same => n,Log(NOTICE, Appel inter-op entrant : ${EXTEN} @ Op__OPERATOR_ID__)
 same => n,Answer()
 same => n,Dial(PJSIP/gsm_msc,30,tT)
 same => n,Log(NOTICE, Appel inter-op terminé: ${DIALSTATUS})
 same => n,Hangup()

exten => i,1,NoOp(=== INTEROP IN: Destination invalide ===)
 same => n,Congestion()
 same => n,Hangup()

; ═════════════════════════════════════════════════════════════════════════════
; [interop_out] — Appels sortants vers autre opérateur
; ═════════════════════════════════════════════════════════════════════════════
; Généré dynamiquement par start.sh

[interop_out]
; Placer ici les routes spécifiques à chaque opérateur
; (les voies 1XXXX → Op1, 2XXXX → Op2, etc.)
exten => _1XXXX,1,NoOp(=== INTEROP OUT Op__OPERATOR_ID__ → Op1: ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@interop_trunk_op1,,rT)
 same => n,NoOp(Status: ${DIALSTATUS})
 same => n,Congestion()
 same => n,Hangup()

exten => _2XXXX,1,NoOp(=== INTEROP OUT Op__OPERATOR_ID__ → Op2: ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@interop_trunk_op2,,rT)
 same => n,NoOp(Status: ${DIALSTATUS})
 same => n,Congestion()
 same => n,Hangup()

exten => _3XXXX,1,NoOp(=== INTEROP OUT Op__OPERATOR_ID__ → Op3: ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@interop_trunk_op3,,rT)
 same => n,NoOp(Status: ${DIALSTATUS})
 same => n,Congestion()
 same => n,Hangup()

exten => _X.,1,NoOp(=== INTEROP OUT: Destination inconnue ${EXTEN} ===)
 same => n,Congestion()
 same => n,Hangup()

exten => i,1,Congestion()

; ═════════════════════════════════════════════════════════════════════════════
; [gsm_in] — Appels GSM entrants (simplifié, sans ExecIf)
; ═════════════════════════════════════════════════════════════════════════════
; 
; NOTE : Ce contexte est appelé lorsque MSC reçoit un appel entrant du réseau GSM.
; En mode multi-opérateur, les appels arrivent via PJSIP/gsm_msc (intra-conteneur).
;
; [BUGFIX] Pas de ExecIf (module pbx_exten_if peut ne pas être chargé).
; Utiliser des sauts simples Goto() ou des extensions directes.

[gsm_in]

; Appels pour abonnés locaux
exten => 100,1,NoOp(=== GSM_IN: MS100 @ Op__OPERATOR_ID__ ===)
 same => n,Log(NOTICE, Appel entrant pour MS 100)
 same => n,Dial(PJSIP/linphone_A,30,tT)
 same => n,Log(NOTICE, Appel MS100 terminé: ${DIALSTATUS})
 same => n,Hangup()

exten => 101,1,NoOp(=== GSM_IN: MS101 @ Op__OPERATOR_ID__ ===)
 same => n,Dial(PJSIP/linphone_B,30,tT)
 same => n,Hangup()

exten => 102,1,NoOp(=== GSM_IN: MS102 @ Op__OPERATOR_ID__ ===)
 same => n,Dial(PJSIP/linphone_C,30,tT)
 same => n,Hangup()

; Appels pour autres opérateurs (1XXXX, 2XXXX, 3XXXX)
exten => _1XXXX,1,NoOp(=== GSM_IN: Inter-op vers Op1 ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@interop_trunk_op1,30,tT)
 same => n,Hangup()

exten => _2XXXX,1,NoOp(=== GSM_IN: Inter-op vers Op2 ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@interop_trunk_op2,30,tT)
 same => n,Hangup()

exten => _3XXXX,1,NoOp(=== GSM_IN: Inter-op vers Op3 ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@interop_trunk_op3,30,tT)
 same => n,Hangup()

; Numéro de secours
exten => 911,1,NoOp(=== GSM_IN: Emergency ===)
 same => n,Dial(PJSIP/linphone_A,30,tT)
 same => n,Hangup()

; Appel invalide
exten => i,1,NoOp(=== GSM_IN: Extension invalide ${EXTEN} ===)
 same => n,Congestion()
 same => n,Hangup()

; Timeout (appel pas répondu)
exten => t,1,NoOp(=== GSM_IN: Timeout ${EXTEN} ===)
 same => n,Hangup()

; ═════════════════════════════════════════════════════════════════════════════
; [default] — Fallback
; ═════════════════════════════════════════════════════════════════════════════

[default]
exten => _X.,1,NoOp(=== DEFAULT: ${EXTEN} ===)
 same => n,Congestion()
 same => n,Hangup()

exten => i,1,Congestion()
