; =========================================================
; Asterisk PJSIP configuration
; MACHINE B
; IP locale : 192.168.1.162
; =========================================================

[global]
type=global
user_agent=TP-Asterisk-PJSIP


; =========================================================
; TRANSPORT SIP PRINCIPAL (Linphone + trunks)
; =========================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=192.168.1.162
external_media_address=192.168.1.162


; =========================================================
; UTILISATEUR SIP LOCAL — LINPHONE B
; =========================================================

[linphone_B]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw
allow=gsm

auth=linphone_B
aors=linphone_B

direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes


[linphone_B]
type=auth
auth_type=userpass
username=linphone_B
password=tester


[linphone_B]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30


; =========================================================
; TRUNK SIP VERS MACHINE A
; =========================================================
; Machine A : 192.168.1.101
; Tous les appels venant de A arrivent en [from_remote]
; =========================================================

[remote_ast]
type=endpoint
transport=transport-udp
context=from_remote
disallow=all
allow=ulaw
allow=gsm

aors=remote_ast

direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[remote_ast]
type=aor
contact=sip:192.168.1.101:5060
qualify_frequency=30

[remote_ast-identify]
type=identify
endpoint=remote_ast
match=192.168.1.101


; =========================================================
; TRUNK SIP GSM — OSMO MSC / sip-connector
; =========================================================
; GSM → Asterisk
; Tous les appels GSM entrent en [gsm_subscriber]
; =========================================================

[gsm_msc-identify]
type=identify
endpoint=gsm_msc
match=127.0.0.1

[gsm_msc]
type=endpoint
transport=transport-udp
context=gsm_subscriber
disallow=all
allow=gsm
allow=ulaw

aors=gsm_msc

direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[gsm_msc]
type=aor
contact=sip:127.0.0.1:5061
qualify_frequency=30
