name: Build ISO

on:
  push:
    tags: ["v*.*.*", "iso-*"]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        type: boolean
        default: true

env:
  ISO_NAME: osmo_egprs.iso

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift \
            /usr/local/graalvm /usr/local/share/chromium \
            /usr/local/lib/node_modules
          sudo apt-get remove -y '^dotnet-.*' 'php.*' 'mongodb.*' \
            'mysql.*' azure-cli google-cloud-cli 2>/dev/null || true
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo docker image prune -af
          df -h /

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin \
            grub-common mtools debootstrap

      - name: Build osmocom-nitb image
        run: |
          if grep -q "libosmocore" Dockerfile; then CORE_DF="Dockerfile";
          elif [ -f Dockerfile.core ]; then CORE_DF="Dockerfile.core";
          else echo "::error::Dockerfile core introuvable"; exit 1; fi
          docker build -f "$CORE_DF" -t osmocom-nitb .

      - name: Build osmocom-run image
        run: |
          [ -f Dockerfile.run ] && docker build -f Dockerfile.run -t osmocom-run . || true

      - name: Reclaim space
        run: docker builder prune -af 2>/dev/null || true

      - name: Build ISO
        run: |
          chmod +x build-iso.sh
          sudo ./build-iso.sh --output="${ISO_NAME}"
          ls -lh "${ISO_NAME}"

      - name: Checksums
        run: |
          sha256sum "${ISO_NAME}" > "${ISO_NAME}.sha256"
          md5sum "${ISO_NAME}" > "${ISO_NAME}.md5"
          cat "${ISO_NAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osmo_egprs-iso
          path: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
          retention-days: 14
          compression-level: 0

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('iso-{0}', github.sha) }}
          name: "osmo_egprs ISO — ${{ github.ref_name || github.sha }}"
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            ## osmo_egprs Live ISO

            Stack Osmocom complète + Dashboard web (port 8080) + Docker Engine

            ```bash
            # QEMU
            qemu-system-x86_64 -cdrom osmo_egprs.iso -m 8G -enable-kvm -cpu host -smp 4 \
              -nic user,hostfwd=tcp::8080-:8080

            # USB
            sudo dd if=osmo_egprs.iso of=/dev/sdX bs=4M status=progress && sync

            # Premier boot
            cd /opt/osmo_egprs && sudo ./start.sh
            ```
          files: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
            ${{ env.ISO_NAME }}.md5
