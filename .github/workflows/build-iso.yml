name: Build ISO

on:
  push:
    tags: ["v*.*.*", "iso-*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub Release"
        type: boolean
        default: true
      no_cache:
        description: "Rebuild Docker images without cache (--no-cache)"
        type: boolean
        default: true

env:
  ISO_NAME: osmo_egprs.iso

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift \
            /usr/local/graalvm /usr/local/share/chromium \
            /usr/local/lib/node_modules
          sudo apt-get remove -y '^dotnet-.*' 'php.*' 'mongodb.*' \
            'mysql.*' azure-cli google-cloud-cli 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo docker image prune -af || true
          df -h /

      # Les paquets hôte (squashfs-tools, xorriso, grub*, mtools, debootstrap...)
      # sont installés directement par build-iso.sh.

      - name: Build ISO via build-iso.sh
        run: |
          chmod +x build-iso.sh
          # --no-cache par defaut (et sur push de tag) ; desactivable via le
          # bouton "Run workflow" en mettant no_cache=false.
          NO_CACHE="--no-cache"
          [ "${{ github.event.inputs.no_cache }}" = "false" ] && NO_CACHE=""
          sudo ./build-iso.sh $NO_CACHE --output="${ISO_NAME}"
          ls -lh "${ISO_NAME}"

      - name: Checksums
        run: |
          sha256sum "${ISO_NAME}" > "${ISO_NAME}.sha256"
          md5sum "${ISO_NAME}" > "${ISO_NAME}.md5"
          cat "${ISO_NAME}.sha256"

      - name: Split ISO for GitHub Release (2 GiB asset limit)
        run: |
          # GitHub Release assets must be < 2 GiB each. Split into 1900 MiB
          # parts named osmo_egprs.iso.part-aa, .part-ab, ...
          split -b 1900M -d -a 2 "${ISO_NAME}" "${ISO_NAME}.part-"
          ls -lh "${ISO_NAME}".part-*
          sha256sum "${ISO_NAME}".part-* > "${ISO_NAME}.parts.sha256"
          cat "${ISO_NAME}.parts.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osmo_egprs-iso
          path: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
            ${{ env.ISO_NAME }}.md5
          retention-days: 14
          compression-level: 0

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('iso-{0}', github.sha) }}
          name: "osmo_egprs ISO — ${{ github.ref_name || github.sha }}"
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            ## osmo_egprs Live ISO

            Build x86_64 généré via `build-iso.sh`.

            ⚠️ L'ISO dépasse la limite GitHub de 2 Gio par fichier de Release,
            elle est donc **découpée en plusieurs parties** (`osmo_egprs.iso.part-*`).
            Téléchargez **toutes** les parties puis recombinez-les :

            ```bash
            # Recombiner l'ISO
            cat osmo_egprs.iso.part-* > osmo_egprs.iso

            # Vérifier l'intégrité
            sha256sum -c osmo_egprs.iso.sha256

            # QEMU
            qemu-system-x86_64 -cdrom osmo_egprs.iso -m 8G -enable-kvm -cpu host -smp 4 \
              -nic user,hostfwd=tcp::8080-:8080

            # USB
            sudo dd if=osmo_egprs.iso of=/dev/sdX bs=4M status=progress && sync

            # Premier boot (lancement manuel de la stack)
            /opt/GSM/osmo_egprs/start-direct.sh
            ```
          files: |
            ${{ env.ISO_NAME }}.part-*
            ${{ env.ISO_NAME }}.sha256
            ${{ env.ISO_NAME }}.md5
            ${{ env.ISO_NAME }}.parts.sha256
