name: Build ISO

on:
  push:
    tags: ["v*.*.*", "iso-*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub Release"
        type: boolean
        default: true

env:
  ISO_NAME: osmo_egprs.iso

jobs:
  build-iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift \
            /usr/local/graalvm /usr/local/share/chromium \
            /usr/local/lib/node_modules
          sudo apt-get remove -y '^dotnet-.*' 'php.*' 'mongodb.*' \
            'mysql.*' azure-cli google-cloud-cli 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          sudo docker image prune -af || true
          df -h /

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin \
            grub-common mtools debootstrap git

      - name: Build ISO via build-iso.sh
        run: |
          chmod +x build-iso.sh
          sudo ./build-iso.sh --output="${ISO_NAME}"
          ls -lh "${ISO_NAME}"

      - name: Checksums
        run: |
          sha256sum "${ISO_NAME}" > "${ISO_NAME}.sha256"
          md5sum "${ISO_NAME}" > "${ISO_NAME}.md5"
          cat "${ISO_NAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: osmo_egprs-iso
          path: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
            ${{ env.ISO_NAME }}.md5
          retention-days: 14
          compression-level: 0

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('iso-{0}', github.sha) }}
          name: "osmo_egprs ISO — ${{ github.ref_name || github.sha }}"
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            ## osmo_egprs Live ISO

            Build x86_64 généré via `build-iso.sh`.

            ```bash
            # QEMU
            qemu-system-x86_64 -cdrom osmo_egprs.iso -m 8G -enable-kvm -cpu host -smp 4 \
              -nic user,hostfwd=tcp::8080-:8080

            # USB
            sudo dd if=osmo_egprs.iso of=/dev/sdX bs=4M status=progress && sync

            # Premier boot
            cd /etc/osmocom/ && sudo ./run.sh
            ```
          files: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
            ${{ env.ISO_NAME }}.md5
