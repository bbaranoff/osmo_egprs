!
! osmo-stp.cfg — STP intra-opérateur __OPERATOR_ID__
! Sert MSC et BSC locaux (rôle SG/serveur).
! Se connecte à l'inter-STP en tant que client M3UA ASP (rôle ASP/client).
!
log stderr
  logging filter all 1
  logging color 1
  logging print category 1
  logging timestamp 0
  logging level lss7 debug
  logging level lsccp notice
  logging level lm3ua debug
!
line vty
 no login
!
cs7 instance 0
 network-indicator international
 point-code __PC_STP__

 ! ── MSC local (PC __PC_MSC__) — connexion entrante ─────────────────────────
 asp asp-msc 2906 2905 m3ua
  local-ip 127.0.0.1
  remote-ip 127.0.0.1
  role sg
  sctp-role server
  no shutdown
 as as-msc m3ua
  asp asp-msc
  routing-key 1 __PC_MSC__
  traffic-mode override

 ! ── BSC local (PC __PC_BSC__) — connexion entrante ─────────────────────────
 asp asp-bsc 2907 2905 m3ua
  local-ip 127.0.0.1
  remote-ip 127.0.0.1
  role sg
  sctp-role server
  no shutdown
 as as-bsc m3ua
  asp asp-bsc
  routing-key 3 __PC_BSC__
  traffic-mode override

 ! ── Routes vers MSC/BSC locaux ──────────────────────────────────────────────
 route-table system
  update route __PC_MSC__ 7.255.7 linkset as-msc
  update route __PC_BSC__ 7.255.7 linkset as-bsc

 ! ── Connexion CLIENT vers l'inter-STP ───────────────────────────────────────
 ! OsmoSTP ne supporte qu'UNE routing-key par AS via RKM.
 ! → 3 ASPs/AS distincts, un par Point Code (MSC, STP, BSC).
 ! Ports locaux : 2908 (MSC), 2909 (STP), 2910 (BSC)
 ! En mode bridge : __INTER_STP_SHUTDOWN__ = no shutdown
 ! En mode host   : __INTER_STP_SHUTDOWN__ = shutdown

 ! ── inter-STP : ASP pour le MSC (__PC_MSC__) ────────────────────────────────
 asp asp-inter-msc 2905 2908 m3ua
  remote-ip __INTER_STP_IP__
  role asp
  sctp-role client
  __INTER_STP_SHUTDOWN__
 as as-inter-msc m3ua
  asp asp-inter-msc
  routing-key __RCTX_MSC__ __PC_MSC__
  traffic-mode override

 ! ── inter-STP : ASP pour le STP (__PC_STP__) ────────────────────────────────
 asp asp-inter-stp 2905 2909 m3ua
  remote-ip __INTER_STP_IP__
  role asp
  sctp-role client
  __INTER_STP_SHUTDOWN__
 as as-inter-stp m3ua
  asp asp-inter-stp
  routing-key __RCTX_STP__ __PC_STP__
  traffic-mode override

 ! ── inter-STP : ASP pour le BSC (__PC_BSC__) ────────────────────────────────
 asp asp-inter-bsc 2905 2910 m3ua
  remote-ip __INTER_STP_IP__
  role asp
  sctp-role client
  __INTER_STP_SHUTDOWN__
 as as-inter-bsc m3ua
  asp asp-inter-bsc
  routing-key __RCTX_BSC__ __PC_BSC__
  traffic-mode override

 ! ── Serveur M3UA local (MSC et BSC se connectent ici) ───────────────────────
 listen m3ua 2905

