!
! osmo-stp.cfg — STP intra-opérateur __OPERATOR_ID__
! Sert MSC et BSC locaux (rôle SG/serveur).
! Se connecte à l'inter-STP en tant que client M3UA ASP (rôle ASP/client).
!
log stderr
  logging filter all 1
  logging color 1
  logging print category 1
  logging timestamp 0
  logging level lss7 debug
  logging level lsccp notice
  logging level lm3ua debug
!
line vty
 no login
!
cs7 instance 0
 network-indicator international
 point-code __PC_STP__

 ! ── MSC local (PC __PC_MSC__) — connexion entrante ─────────────────────────
 ! Le STP écoute sur 2905 (listen m3ua), le MSC se connecte depuis 2906.
 ! role sg / sctp-role server : c'est le STP qui est le serveur SCTP.
 asp asp-msc 2906 2905 m3ua
  local-ip 127.0.0.1
  remote-ip 127.0.0.1
  role sg
  sctp-role server
  no shutdown
 as as-msc m3ua
  asp asp-msc
  routing-key 1 __PC_MSC__
  traffic-mode override

 ! ── BSC local (PC __PC_BSC__) — connexion entrante ─────────────────────────
 asp asp-bsc 2907 2905 m3ua
  local-ip 127.0.0.1
  remote-ip 127.0.0.1
  role sg
  sctp-role server
  no shutdown
 as as-bsc m3ua
  asp asp-bsc
  routing-key 3 __PC_BSC__
  traffic-mode override

 ! NOTE: pas de route-table statique pour __PC_MSC__ et __PC_BSC__ :
 ! les routing-keys ci-dessus créent déjà ces routes localement.
 ! Les ajouter en statique crée des doublons dans la route table
 ! et provoque une ambiguïté de routage (bug observé).

 ! ── Connexion CLIENT vers l'inter-STP ───────────────────────────────────────
 ! 2 ASPs/AS : un pour le MSC, un pour le BSC.
 ! Le STP lui-même n'a pas besoin d'être enregistré à l'inter-STP
 ! (suppression de as-inter-stp qui causait des routes dynamiques parasites
 !  pour __PC_BSC__ via as-inter-stp et as-inter-msc).
 !
 ! En mode bridge : __INTER_STP_SHUTDOWN__ = no shutdown
 ! En mode host   : __INTER_STP_SHUTDOWN__ = shutdown

 ! ── inter-STP : ASP pour le MSC (__PC_MSC__) ────────────────────────────────
 asp asp-inter-msc 2905 2908 m3ua
  remote-ip __INTER_STP_IP__
  role asp
  sctp-role client
  __INTER_STP_SHUTDOWN__
 as as-inter-msc m3ua
  asp asp-inter-msc
  routing-key __RCTX_MSC__ __PC_MSC__
  traffic-mode override

 ! NOTE: as-inter-bsc supprimé intentionnellement.
 ! Annoncer __PC_BSC__ à l'inter-STP provoque un retour de route dynamique
 ! pour ce même PC vers l'intra-STP via as-inter-msc.
 ! Le BSC est 100% intra-opérateur : son PC ne doit pas quitter cet intra-STP.

 ! ── Serveur M3UA local (MSC et BSC se connectent ici) ───────────────────────
 listen m3ua 2905
