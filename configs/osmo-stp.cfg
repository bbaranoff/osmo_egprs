!
! osmo-stp.cfg — Signal Transfer Point opérateur __OPERATOR_ID__
!
! Architecture :
!   [BSC __PC_BSC__] ─►┐
!                       ├─ STP __PC_STP__ @ 127.0.0.1:2905 (local)
!   [MSC __PC_MSC__] ─►┘        │
!                               │ asp client → inter-STP __INTER_STP_IP__:2908
!                               ▼
!                        [Inter-STP 0.23.0]
!
! BSC/MSC se connectent au STP via 127.0.0.1 (même container).
! Le STP écoute sur 127.0.0.1:2905 pour accepter connexions locales.
!

log stderr
 logging filter all 1
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging print extended-timestamp 1
 logging print level 1
 logging print file basename
 logging level lss7 info
 logging level lsccp info
 logging level lm3ua info
 logging level linp notice
!
stats interval 5
!
line vty
 no login
 bind 127.0.0.1
 port 4239
!
cs7 instance 0
 network-indicator international
 point-code __PC_STP__
!
 ! ── Listener local ──────────────────────────────────────────────────────
 ! 127.0.0.1 : accepte les connexions locales (BSC/MSC)
 ! Le XUA (SIGTRAN) est le protocole de transport pour M3UA/SCCP
 xua rkm routing-key-allocation dynamic-permitted
 
 listen m3ua 2905
  accept-asp-connections dynamic-permitted
  local-ip 127.0.0.1
!
 ! ── Lien client vers l'inter-STP central ────────────────────────────────
 ! asp-to-inter : connexion client vers inter-STP @ __INTER_STP_IP__:2908
 asp asp-to-inter 2908 2910 m3ua
  remote-ip __INTER_STP_IP__
  local-ip __INTER_LOCAL_IP__
  role asp
  sctp-role client
  __INTER_STP_SHUTDOWN__
!
 ! ── Application Server (AS) ─────────────────────────────────────────────
 ! Relie l'ASP client à la route vers l'inter-STP
 as as-inter m3ua
  asp asp-to-inter
  routing-key __RCTX_INTER__ __PC_STP__
  traffic-mode override
!
 ! ── Routage ─────────────────────────────────────────────────────────────
 ! Routes locales : créées automatiquement par les connexions BSC/MSC
 ! Catch-all (0.0.0/14) : tout ce qui n'est pas local → inter-STP
 route-table system
  update route 0.0.0 0.0.0 linkset as-inter
!
