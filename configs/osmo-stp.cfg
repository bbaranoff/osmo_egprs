!
! osmo-stp.cfg — STP intra-opérateur __OPERATOR_ID__
! Sert MSC et BSC locaux (rôle SG/serveur).
! Se connecte à l'inter-STP en tant que client M3UA ASP (rôle ASP/client).
!
log stderr
  logging filter all 1
  logging color 1
  logging print category 1
  logging timestamp 0
  logging level lss7 debug
  logging level lsccp notice
  logging level lm3ua debug
!
line vty
 no login
!
cs7 instance 0
 network-indicator international
 point-code __PC_STP__

 ! ── MSC local (PC __PC_MSC__) — connexion entrante ─────────────────────────
 asp asp-msc 2906 2905 m3ua
  local-ip 127.0.0.1
  remote-ip 127.0.0.1
  role sg
  sctp-role server
  no shutdown
 as as-msc m3ua
  asp asp-msc
  routing-key 1 __PC_MSC__
  traffic-mode override

 ! ── BSC local (PC __PC_BSC__) — connexion entrante ─────────────────────────
 asp asp-bsc 2907 2905 m3ua
  local-ip 127.0.0.1
  remote-ip 127.0.0.1
  role sg
  sctp-role server
  no shutdown
 as as-bsc m3ua
  asp asp-bsc
  routing-key 3 __PC_BSC__
  traffic-mode override

 ! ── Routes vers MSC/BSC locaux ──────────────────────────────────────────────
 route-table system
  update route __PC_MSC__ 7.255.7 linkset as-msc
  update route __PC_BSC__ 7.255.7 linkset as-bsc

 ! ── Connexion CLIENT vers l'inter-STP ───────────────────────────────────────
 ! En mode bridge  : __INTER_STP_IP__ = 172.20.0.10, __INTER_STP_SHUTDOWN__ = no shutdown
 ! En mode host    : asp désactivé    (__INTER_STP_SHUTDOWN__ = shutdown)
 ! Port local 2908 : distinct de listen 2905 → pas de conflit SO_REUSEADDR
 asp asp-to-inter 2908 2905 m3ua
  remote-ip __INTER_STP_IP__
  role asp
  sctp-role client
  __INTER_STP_SHUTDOWN__
 as as-to-inter m3ua
  asp asp-to-inter
  ! Enregistre toutes les routes de cet opérateur via RKM
  routing-key 10 __PC_MSC__
  routing-key 30 __PC_BSC__
  routing-key 20 __PC_STP__
  traffic-mode override

 ! ── Serveur M3UA local (MSC et BSC se connectent ici) ───────────────────────
 listen m3ua 2905
