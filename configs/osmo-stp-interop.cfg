log stderr
 logging filter all 1
 logging color 1
 logging print category 1
 logging level lss7 debug
 logging level lsccp notice
 logging level lm3ua debug

line vty
 no login

cs7 instance 0
 network-indicator international
 point-code 0.23.0

 asp asp-op1 2910 2908 m3ua
  local-ip 172.20.0.10
  remote-ip 172.20.0.11
  role sg
  sctp-role server
  no shutdown

 asp asp-op2 2910 2908 m3ua
  local-ip 172.20.0.10
  remote-ip 172.20.0.12
  role sg
  sctp-role server
  no shutdown

 as as-op1 m3ua
  asp asp-op1
  traffic-mode override

 as as-op2 m3ua
  asp asp-op2
  traffic-mode override

 route-table system

 listen m3ua 2908
  local-ip 172.20.0.10
end
