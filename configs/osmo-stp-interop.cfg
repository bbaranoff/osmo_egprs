log stderr
 logging filter all 1
 logging color 1
 logging print category 1
 logging level lss7 debug
 logging level lsccp notice
 logging level lm3ua debug

line vty
 no login

cs7 instance 0
 network-indicator international
 point-code 0.23.0

 ! ─────────────────────────────────────────────
 ! Opérateur 1 @ 172.20.0.11
 ! AS avec routing-key 999 (correspond as-inter)
 ! ─────────────────────────────────────────────
 asp asp-op1 2910 2908 m3ua
  remote-ip 172.20.0.11
  local-ip  172.20.0.10
  role sg
  sctp-role server
  no shutdown

 as as-op1 m3ua
  asp asp-op1
  routing-key 999 0.0.0
  traffic-mode override

 ! ─────────────────────────────────────────────
 ! Opérateur 2 @ 172.20.0.12
 ! AS avec routing-key 999 (correspond as-inter)
 ! ─────────────────────────────────────────────
 asp asp-op2 2910 2908 m3ua
  remote-ip 172.20.0.12
  local-ip  172.20.0.10
  role sg
  sctp-role server
  no shutdown

 as as-op2 m3ua
  asp asp-op2
  routing-key 999 0.0.0
  traffic-mode override

 ! ─────────────────────────────────────────────
 ! Serveur M3UA : écoute sur port 2908
 ! Routes créées via routing-key 999
 ! ─────────────────────────────────────────────
 listen m3ua 2908
  local-ip 172.20.0.10
