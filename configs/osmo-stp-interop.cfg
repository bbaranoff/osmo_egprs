!
! osmo-stp-interop.cfg — STP inter-opérateurs (serveur unique)
! Chaque STP intra-opérateur s'y connecte en tant que client M3UA ASP.
! Le routage des Point Codes est entièrement dynamique (RKM dynamic-permitted).
!
log stderr
  logging filter all 1
  logging color 1
  logging print category 1
  logging timestamp 0
  logging level lss7 debug
  logging level lsccp notice
  logging level lm3ua debug
!
line vty
 no login
!
cs7 instance 0
 network-indicator international
 !
 ! Point Code de l'inter-STP (fixe, commun à tous les opérateurs)
 point-code 0.23.0
 !
 ! Allocation dynamique des routing-keys : chaque ASP client enregistre
 ! ses routes via RKM sans pré-configuration côté serveur.
 xua rkm routing-key-allocation dynamic-permitted
 !
 ! Serveur M3UA : accepte toutes les connexions ASP entrantes dynamiquement.
 ! Chaque STP opérateur se connecte ici comme client (sctp-role client).
 listen m3ua 2905
  accept-asp-connections dynamic-permitted
