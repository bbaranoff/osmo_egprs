!
! osmo-stp-interop.cfg — EXEMPLE 2 opérateurs (référence uniquement)
!
! ⚠ Ce fichier est GÉNÉRÉ AUTOMATIQUEMENT par create_interop.sh au démarrage.
!   Ne pas éditer — relancer start.sh pour le régénérer.
!
! Pour regénérer manuellement :
!   ./create_interop.sh 2 configs/osmo-stp-interop.cfg
!
! Architecture :
!   - 1 AS par opérateur SANS routing-key (catch-all par opérateur)
!   - Routage sur DPC (point code destination), pas sur RCTX
!   - dynamic-permitted : les STPs se connectent sans être pré-déclarés
!
log stderr
 logging filter all 1
 logging color 1
 logging print category 1
 logging print extended-timestamp 1
 logging print level 1
 logging level lss7 info
 logging level lm3ua info
!
line vty
 no login
!
cs7 instance 0
 network-indicator international
 point-code 0.23.0
!
 ! Écoute sur 172.20.0.10:2908
 listen m3ua 2908
  local-ip 172.20.0.10
  accept-asp-connections dynamic-permitted
!
 ! ── Opérateur 1 : STP 1.23.2 @ 172.20.0.11 ──────────────────────────────
 as as-op1 m3ua
  traffic-mode override
!
 ! ── Opérateur 2 : STP 2.23.2 @ 172.20.0.12 ──────────────────────────────
 as as-op2 m3ua
  traffic-mode override
!
 ! ── Table de routage SS7 ──────────────────────────────────────────────────
 route-table system
  ! Op1 : MSC=1.23.1  STP=1.23.2  BSC=1.23.3 → as-op1
  update route 1.23.1 7.255.7 linkset as-op1
  update route 1.23.2 7.255.7 linkset as-op1
  update route 1.23.3 7.255.7 linkset as-op1
  ! Op2 : MSC=2.23.1  STP=2.23.2  BSC=2.23.3 → as-op2
  update route 2.23.1 7.255.7 linkset as-op2
  update route 2.23.2 7.255.7 linkset as-op2
  update route 2.23.3 7.255.7 linkset as-op2
