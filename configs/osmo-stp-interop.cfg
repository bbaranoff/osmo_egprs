!
! osmo-stp-interop.cfg — STP inter-opérateurs (serveur unique)
! Config statique, aucun placeholder.
! Chaque STP intra-opérateur s'y connecte en tant que client M3UA ASP.
! Le routage des Point Codes est entièrement dynamique (RKM dynamic-permitted).
!
log stderr
  logging filter all 1
  logging color 1
  logging print category 1
  logging timestamp 0
  logging level lss7 info
  logging level lsccp info
  logging level lm3ua info
!
line vty
 no login
!
cs7 instance 0
 network-indicator international
 point-code 0.23.0
 xua rkm routing-key-allocation dynamic-permitted

 listen m3ua 2905
  accept-asp-connections dynamic-permitted
