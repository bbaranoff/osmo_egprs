!
! osmo-msc.cfg — MSC opérateur __OPERATOR_ID__ (MCC __MCC__ / MNC __MNC__)
!
log stderr
 logging filter all 1
 logging color 1
 logging print category-hex 1
 logging print category 0
 logging print thread-id 0
 logging timestamp 0
 logging print file 1
 logging level rll notice
 logging level cc notice
 logging level bcc notice
 logging level gcc notice
 logging level mm notice
 logging level rr notice
 logging level mncc notice
 logging level pag notice
 logging level msc notice
 logging level mgcp notice
 logging level ho notice
 logging level db notice
 logging level ref notice
 logging level ctrl notice
 logging level smpp notice
 logging level ranap notice
 logging level vlr notice
 logging level iucs notice
 logging level bssap notice
 logging level sgs notice
 logging level ss notice
 logging level asci notice
 logging level lglobal notice
 logging level llapd notice
 logging level linp notice
 logging level lmux notice
 logging level lmi notice
 logging level lmib notice
 logging level lsms notice
 logging level lctrl notice
 logging level lgtp notice
 logging level lstats notice
 logging level lgsup notice
 logging level loap notice
 logging level lss7 debug
 logging level lsccp notice
 logging level lsua notice
 logging level lm3ua notice
 logging level lmgcp notice
 logging level ljibuf notice
 logging level lrspro notice
 logging level lns notice
 logging level lbssgp notice
 logging level lnsdata notice
 logging level lnssignal notice
 logging level liuup notice
 logging level lpfcp notice
 logging level lcsn1 notice
 logging level lio notice
 logging level ltcap notice
!
stats interval 5
!
line vty
 no login
!
cs7 instance 0
 network-indicator international
 point-code __PC_MSC__
 ! ── Connexion vers le STP intra-opérateur (127.0.0.1) ──────────────────────
 asp asp-to-stp 2905 2906 m3ua
  local-ip 127.0.0.1
  remote-ip 127.0.0.1
  role asp
  sctp-role client
  no shutdown
 as as-msc m3ua
  asp asp-to-stp
  routing-key 1 __PC_MSC__
  traffic-mode override

 ! ── BSC local ───────────────────────────────────────────────────────────────
 sccp-address addr-bsc
  routing-indicator PC
  point-code __PC_BSC__
  subsystem-number 254

 ! ── Adresse GT de ce MSC (pour identification SCCP) ─────────────────────────
 sccp-address addr-msc-gt
  routing-indicator GT
  point-code __PC_MSC__
  global-title
   global-title-indicator 4
   translation-type 0
   numbering-plan-indicator 1
   nature-of-address-indicator 4
   digits +3310203040__OPERATOR_ID__

 ! ── MSC distant pour appels inter-opérateurs ─────────────────────────────────
 ! Point Code du MSC de l'opérateur distant.
 ! En pratique, les appels inter-op passent par le trunk SIP Asterisk↔Asterisk
 ! (plus simple et déjà opérationnel). Cette adresse SCCP est fournie pour
 ! permettre un routage SS7 direct si nécessaire.
 ! __INTEROP_PC_MSC__ = PC du MSC distant (ex: 2.23.1 si cet op est Op1)
 sccp-address addr-msc-interop
  routing-indicator PC
  point-code __INTEROP_PC_MSC__
  subsystem-number 254
network
 network country code __MCC__
 mobile network code __MNC__
 short name __OP_NAME__
 long name __OP_NAME__
 encryption a5 1
 authentication optional
 rrlp mode none
 mm info 0
 mgw 0
  remote-ip 127.0.0.1
msc
 mncc external /tmp/msc_mncc
 mncc guard-timeout 180
 ncss guard-timeout 30
 assign-tmsi
 lcls-permitted
 cs7-instance-a 0
 check-imei-rqd early
mncc-int
 default-codec tch-f fr
 default-codec tch-h hr
smpp
 local-tcp-port 2775
 policy closed
 no smpp-first
 esme msc_tester
  password osmocom1
  route prefix national isdn 33
hlr
 remote-ip __HLR_IP__
 remote-port 4222
 ipa-name VLR-SDR-OP__OPERATOR_ID__
sgs
 local-port 29118
 local-ip 0.0.0.0
 vlr-name vlr.op__OPERATOR_ID__.net
smsc
 queue max-pending 20
 queue max-failure 1
 database delete-delivered 1
 database delete-expired 1
 validity-period minimum 1
 validity-period default 10080
asci
 disable
 gcr
