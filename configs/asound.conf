# asound.conf — Routage ALSA pour osmo_egprs
#
# gsm_out / gsm_in → sink PulseAudio "gsm_audio" (isolé, 8kHz mono)
#   → mobile écrit sur son propre sink, ne bloque pas le desktop
#   → module-loopback redirige le son vers les HP
#
# default → PulseAudio default (Linphone, navigateur, etc.)
#   → pas de conflit avec mobile

pcm.gsm_out {
    type pulse
    device gsm_audio
}

pcm.gsm_in {
    type pulse
}

pcm.!default {
    type pulse
}

ctl.!default {
    type pulse
}
