# /etc/asound.conf — Osmocom GSM audio via PulseAudio
#
# gsm_out : osmo-gapk playback → PulseAudio sink "gsm_audio"
# gsm_in  : osmo-gapk capture  → PulseAudio source par défaut

pcm.gsm_out {
    type pulse
    device gsm_audio
}

ctl.gsm_out {
    type pulse
}

pcm.gsm_in {
    type pulse
}

pcm.!default {
    type pulse
}

ctl.!default {
    type pulse
}
