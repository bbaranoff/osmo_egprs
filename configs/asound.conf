# /etc/asound.conf — Osmocom GSM audio via PulseAudio
#
# gsm_out : osmo-gapk playback → sink PulseAudio "gsm_audio"
# gsm_in  : osmo-gapk capture  → moniteur de "gsm_mic" (silence)
#
# [2026-08-08] gsm_in n'avait PAS de `device` : il retombait sur la source par
# défaut, qui est gsm_audio.monitor — la sortie que les mobiles venaient
# d'écrire. Chaque mobile s'entendait donc lui-même et entendait l'autre :
# boucle fermée par construction (mesuré : RMS ×11 en 10 s sur un appel de 13 s,
# crête 17728). En pointant la capture sur un sink que personne n'alimente, la
# boucle s'ouvre sans changer quoi que ce soit côté mobiles.

pcm.gsm_out {
    type pulse
    device gsm_audio
}

ctl.gsm_out {
    type pulse
}

pcm.gsm_in {
    type pulse
    device gsm_mic.monitor
}

ctl.gsm_in {
    type pulse
}

pcm.!default {
    type pulse
}

ctl.!default {
    type pulse
}
