; =============================================================================
; extensions.conf — Asterisk dialplan — Opérateur __OPERATOR_ID__
;
; ┌─────────────────────────────────────────────────────────────────────────┐
; │  PLAN DE NUMÉROTATION                                                   │
; │  100        Linphone A (softphone local)                                │
; │  200        Linphone B (softphone local)                                │
; │  600        Echo test                                                   │
; │  700        Annonce de bienvenue                                        │
; │  1XXXX      Abonnés GSM opérateur 1  (routés vers gsm_msc local si op1)│
; │  2XXXX      Abonnés GSM opérateur 2  (routés vers gsm_msc local si op2)│
; │  9XXXXXX    Sortie inter-opérateur   (9 + numéro complet)              │
; ├─────────────────────────────────────────────────────────────────────────┤
; │  CONTEXTES                                                               │
; │  [internal]     Appels depuis softphones locaux                         │
; │  [gsm_in]       Appels entrants depuis OsmoMSC (GSM → Asterisk)        │
; │  [interop_in]   Appels entrants depuis un opérateur distant (SIP trunk) │
; │  [gsm_out]      Sous-contexte : sortie vers MSC local                  │
; │  [interop_out]  Sous-contexte : sortie vers Asterisk distant            │
; └─────────────────────────────────────────────────────────────────────────┘
;
; SCÉNARIOS COUVERTS
; ──────────────────
; 1. MS → MS  (même opérateur)     : MS → MSC → MNCC → Asterisk → MNCC → MSC → MS
; 2. MS → Linphone                  : MS → MSC → Asterisk SIP → Linphone
; 3. Linphone → MS                  : Linphone SIP → Asterisk → MNCC → MSC → MS
; 4. Linphone A → Linphone B        : SIP local
; 5. MS(Op1) → MS(Op2) inter-op    : MNCC → Asterisk Op1 → SIP trunk → Asterisk Op2 → MNCC → MS
; 6. MS → echo / annonce            : test audio
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; IP du MSC local (MNCC socket)
MSC_LOCAL=127.0.0.1
; Préfixe de l'opérateur local (__OPERATOR_ID__)
OP_PREFIX=__OPERATOR_ID__

; =============================================================================
; [internal] — Appels DEPUIS les softphones (Linphone A / Linphone B)
; =============================================================================
[internal]

; ── Test audio ───────────────────────────────────────────────────────────────
; Scénario 6 : Echo test (composer 600)
exten => 600,1,NoOp(=== ECHO TEST ===)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; Annonce de bienvenue (composer 700)
exten => 700,1,NoOp(=== ANNONCE ===)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; ── Softphone → Softphone (même machine) ─────────────────────────────────────
; Scénario 4a : Linphone A → Linphone B (composer 200)
exten => 200,1,NoOp(=== SIP: Linphone A -> Linphone B ===)
 same => n,Dial(PJSIP/linphone_B,,rT)
 same => n,Congestion()
 same => n,Hangup()

; Scénario 4b : Linphone B → Linphone A (composer 100)
exten => 100,1,NoOp(=== SIP: Linphone B -> Linphone A ===)
 same => n,Dial(PJSIP/linphone_A,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Softphone → GSM local (même opérateur) ───────────────────────────────────
; Scénario 3 : Linphone → MS opérateur local
; Numéros : __OPERATOR_ID__XXXX (ex: 10001 pour op1, 20001 pour op2)
exten => ___OPERATOR_ID__XXXX,1,NoOp(=== SIP -> GSM local (Op__OPERATOR_ID__): ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Softphone → GSM inter-opérateur ─────────────────────────────────────────
; Scénario 5 (sortant) : Linphone Op1 → MS Op2
; Composer 9 + numéro complet (ex: 920001 pour joindre 20001 sur Op2)
exten => _9.,1,NoOp(=== SIP -> INTER-OP: ${EXTEN:1} ===)
 same => n,Goto(interop_out,${EXTEN:1},1)

; ── Catch-all : essayer le MSC local ─────────────────────────────────────────
exten => _X.,1,NoOp(=== SIP -> GSM fallback: ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; =============================================================================
; [gsm_in] — Appels entrants DEPUIS OsmoMSC (GSM → Asterisk)
; L'appelant est un MS, le CALLED NUMBER est le numéro composé.
; =============================================================================
[gsm_in]

; ── Scénario 6 : MS → Echo test ─────────────────────────────────────────────
exten => 600,1,NoOp(=== GSM -> ECHO TEST ===)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; ── Scénario 2a : MS → Linphone A ───────────────────────────────────────────
exten => 100,1,NoOp(=== GSM -> Linphone A ===)
 same => n,Dial(PJSIP/linphone_A,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Scénario 2b : MS → Linphone B ───────────────────────────────────────────
exten => 200,1,NoOp(=== GSM -> Linphone B ===)
 same => n,Dial(PJSIP/linphone_B,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Scénario 1 : MS → MS (même opérateur) ───────────────────────────────────
; Asterisk reçoit l'appel GSM, le repasse au MSC local via SIP→MNCC
exten => ___OPERATOR_ID__XXXX,1,NoOp(=== GSM -> GSM local (Op__OPERATOR_ID__): ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Scénario 5 (entrant GSM, sortant inter-op) : MS(Op1) → MS(Op2) ──────────
; Un MS de cet opérateur compose un numéro d'un autre opérateur
; Numéros Op1 : 1XXXX / Op2 : 2XXXX / etc.
; Si le préfixe ne correspond pas à l'opérateur local → inter-op
exten => _[0-9]XXXX,1,NoOp(=== GSM -> INTER-OP routing: ${EXTEN} ===)
 same => n,GotoIf($["${EXTEN:0:1}" = "__OPERATOR_ID__"]?local,${EXTEN},1)
 same => n,Goto(interop_out,${EXTEN},1)

exten => local,1,NoOp(=== GSM -> GSM local fallback: ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Catch-all ────────────────────────────────────────────────────────────────
exten => _X.,1,NoOp(=== GSM -> dispatch: ${EXTEN} ===)
 same => n,Goto(gsm_in,${EXTEN},1)

; =============================================================================
; [interop_in] — Appels entrants DEPUIS un opérateur distant (SIP trunk)
; =============================================================================
[interop_in]

; ── Scénario 5 (arrivée) : MS(OpX) → MS(cet opérateur) ─────────────────────
; Asterisk distant envoie l'appel via le trunk SIP inter-op.
; Le numéro de destination est celui du MS local.
exten => ___OPERATOR_ID__XXXX,1,NoOp(=== INTER-OP -> GSM local: ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Scénario 5 → Linphone : opérateur distant → softphone local ──────────────
exten => 100,1,NoOp(=== INTER-OP -> Linphone A ===)
 same => n,Dial(PJSIP/linphone_A,,rT)
 same => n,Hangup()

exten => 200,1,NoOp(=== INTER-OP -> Linphone B ===)
 same => n,Dial(PJSIP/linphone_B,,rT)
 same => n,Hangup()

; Catch-all : refus propre
exten => _X.,1,NoOp(=== INTER-OP -> numéro inconnu: ${EXTEN} ===)
 same => n,Congestion()
 same => n,Hangup()

; =============================================================================
; [interop_out] — Sortie vers un opérateur distant (SIP trunk inter-op)
; Appelé depuis gsm_in ou internal via Goto(interop_out,NUMÉRO,1)
; =============================================================================
[interop_out]

; Envoi de l'appel vers l'Asterisk distant via le trunk interop_trunk
exten => _X.,1,NoOp(=== INTEROP OUT: ${EXTEN} -> __INTEROP_TRUNK_IP__ ===)
 same => n,Dial(PJSIP/${EXTEN}@interop_trunk,,rT)
 same => n,NoOp(Échec inter-op: ${DIALSTATUS})
 same => n,Congestion()
 same => n,Hangup()
