; =============================================================================
; extensions.conf — Asterisk dialplan — Opérateur __OPERATOR_ID__
;
; NOTES D'ARCHITECTURE
; ────────────────────
; • [interop_out] N'EST PAS défini ici — il est généré dynamiquement par
;   generate_extensions_interop_out() dans start.sh et APPENDÉ à ce fichier.
;   Ne pas le redéfinir ici pour éviter le doublon de contexte qui casse le
;   catch-all _X. vers un interop_trunk avec IP non substituée.
;
; • [gsm_in] gère la normalisation du numéro appelé : l'osmo-sip-connector
;   peut envoyer le numéro avec TON=international ('+100') ou national ('100').
;   Les deux formes sont capturées et renvoyées vers le même label de traitement.
;
; PLAN DE NUMÉROTATION
; ────────────────────
;   100          Linphone A (softphone local)
;   200          Linphone B (softphone local)
;   600          Echo test
;   700          Annonce de bienvenue
;   __OPERATOR_ID__XXXX   Abonnés GSM cet opérateur  (ex 10001..10009)
;   2XXXX–9XXXX  Abonnés GSM autre opérateur (inter-op)
;   9.           Préfixe sortie inter-op depuis softphone (9 + numéro)
;
; CONTEXTES
; ─────────
;   [internal]     Appels depuis les softphones Linphone
;   [gsm_in]       Appels entrants depuis OsmoMSC → osmo-sip-connector
;   [interop_in]   Appels entrants depuis un Asterisk distant (SIP trunk)
;   [interop_out]  ← GÉNÉRÉ DYNAMIQUEMENT (ne pas définir ici)
; =============================================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
OP_PREFIX=__OPERATOR_ID__

; =============================================================================
; [internal] — Appels DEPUIS les softphones Linphone
; =============================================================================
[internal]

; ── Tests audio ──────────────────────────────────────────────────────────────
exten => 600,1,NoOp(=== ECHO TEST ===)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

exten => 700,1,NoOp(=== ANNONCE ===)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; ── Softphone ↔ Softphone ────────────────────────────────────────────────────
exten => 100,1,NoOp(=== SIP: -> Linphone A ===)
 same => n,ExecIf($["${PJSIP_ENDPOINT(linphone_A,devicestate)}" = "Unavailable"]?Congestion(3))
 same => n,Dial(PJSIP/linphone_A,,rT)
 same => n,Congestion()
 same => n,Hangup()

exten => 200,1,NoOp(=== SIP: -> Linphone B ===)
 same => n,ExecIf($["${PJSIP_ENDPOINT(linphone_B,devicestate)}" = "Unavailable"]?Congestion(3))
 same => n,Dial(PJSIP/linphone_B,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Softphone → GSM local (cet opérateur, MSISDNs __OPERATOR_ID__XXXX) ──────
; Après substitution pour op N :  _NXXXX  (ex: _1XXXX pour op1)
exten => ___OPERATOR_ID__XXXX,1,NoOp(=== SIP -> GSM local Op__OPERATOR_ID__: ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Softphone → sortie inter-opérateur (préfixe 9) ───────────────────────────
exten => _9.,1,NoOp(=== SIP -> INTER-OP: ${EXTEN:1} ===)
 same => n,Goto(interop_out,${EXTEN:1},1)

; ── Fallback → MSC local ─────────────────────────────────────────────────────
exten => _X.,1,NoOp(=== SIP -> GSM fallback: ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; =============================================================================
; [gsm_in] — Appels entrants DEPUIS OsmoMSC via osmo-sip-connector
;
; IMPORTANT — Normalisation du numéro appelé :
;   osmo-sip-connector encode le TP-DA avec le TON du MS :
;     TON=international → Request-URI : sip:+100@...  → EXTEN = +100
;     TON=national/unknown → Request-URI : sip:100@... → EXTEN = 100
;   Les deux formes sont gérées via des alias explicites sur les extensions
;   courtes (100, 200, 600) et par un Set()/GotoIf sur les MSISDN longs.
; =============================================================================
[gsm_in]

; ── Normalisation : forme +XXX → alias vers la forme sans + ─────────────────
; Extensions courtes Linphone et test
exten => +100,1,Goto(gsm_in,100,1)
exten => +200,1,Goto(gsm_in,200,1)
exten => +600,1,Goto(gsm_in,600,1)
exten => +700,1,Goto(gsm_in,700,1)

; ── Echo test (direct) ───────────────────────────────────────────────────────
exten => 600,1,NoOp(=== GSM -> ECHO TEST ===)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

exten => 700,1,NoOp(=== GSM -> ANNONCE ===)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

; ── MS → Linphone A ──────────────────────────────────────────────────────────
exten => 100,1,NoOp(=== GSM -> Linphone A ===)
 same => n,ExecIf($["${PJSIP_ENDPOINT(linphone_A,devicestate)}" = "Unavailable"]?Congestion(3))
 same => n,Dial(PJSIP/linphone_A,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── MS → Linphone B ──────────────────────────────────────────────────────────
exten => 200,1,NoOp(=== GSM -> Linphone B ===)
 same => n,ExecIf($["${PJSIP_ENDPOINT(linphone_B,devicestate)}" = "Unavailable"]?Congestion(3))
 same => n,Dial(PJSIP/linphone_B,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── MS → MS cet opérateur (MSISDN __OPERATOR_ID__XXXX) ──────────────────────
; Pattern plus spécifique que _[0-9]XXXX : prioritaire pour l'opérateur local.
; Après substitution op1 : _1XXXX → matche 10001–19999
exten => ___OPERATOR_ID__XXXX,1,NoOp(=== GSM -> GSM local Op__OPERATOR_ID__: ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── MS → MSISDN 5 chiffres (autre opérateur potentiel) ──────────────────────
; On normalise d'abord le EXTEN (suppression éventuelle du +).
exten => _[0-9]XXXX,1,NoOp(=== GSM -> routing 5-digit: ${EXTEN} ===)
 same => n,Set(DEST=${EXTEN})
 ; Si même opérateur → MSC local  (GotoIf plus lisible avec label nommé)
 same => n,GotoIf($["${DEST:0:1}" = "__OPERATOR_ID__"]?local_gsm,1)
 same => n,Goto(interop_out,${DEST},1)

exten => _[0-9]XXXX,n(local_gsm),NoOp(=== GSM -> GSM local fallback: ${DEST} ===)
 same => n,Dial(PJSIP/${DEST}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; ── Forme +NXXXX (TON=international, MSISDN long) ────────────────────────────
exten => _+[0-9]XXXX,1,NoOp(=== GSM -> routing +5-digit normalized: ${EXTEN} ===)
 same => n,Goto(gsm_in,${EXTEN:1},1)

; ── Catch-all ────────────────────────────────────────────────────────────────
exten => _X.,1,NoOp(=== GSM -> numéro inconnu: ${EXTEN} ===)
 same => n,Congestion()
 same => n,Hangup()

; =============================================================================
; [interop_in] — Appels entrants DEPUIS un opérateur distant (SIP trunk)
; =============================================================================
[interop_in]

; MS de cet opérateur (appelé depuis un autre réseau)
exten => ___OPERATOR_ID__XXXX,1,NoOp(=== INTER-OP -> GSM local Op__OPERATOR_ID__: ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@gsm_msc,,rT)
 same => n,Congestion()
 same => n,Hangup()

; Softphones joignables depuis inter-op
exten => 100,1,NoOp(=== INTER-OP -> Linphone A ===)
 same => n,ExecIf($["${PJSIP_ENDPOINT(linphone_A,devicestate)}" = "Unavailable"]?Congestion(3))
 same => n,Dial(PJSIP/linphone_A,,rT)
 same => n,Hangup()

exten => 200,1,NoOp(=== INTER-OP -> Linphone B ===)
 same => n,ExecIf($["${PJSIP_ENDPOINT(linphone_B,devicestate)}" = "Unavailable"]?Congestion(3))
 same => n,Dial(PJSIP/linphone_B,,rT)
 same => n,Hangup()

; Normalisation +prefix depuis trunk distant
exten => _+.,1,NoOp(=== INTER-OP normalize + ===)
 same => n,Goto(interop_in,${EXTEN:1},1)

; Catch-all
exten => _X.,1,NoOp(=== INTER-OP -> inconnu: ${EXTEN} ===)
 same => n,Congestion()
 same => n,Hangup()

; =============================================================================
; [interop_out] est APPENDÉ ici automatiquement par start.sh via
;   generate_extensions_interop_out op_id n_operators >> extensions.conf
; NE PAS l'ajouter manuellement.
; =============================================================================
