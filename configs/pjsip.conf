; ============================
; /etc/asterisk/pjsip.conf
; ============================

[global]
type=global
user_agent=TP-Asterisk-PJSIP

; ============================
; Transport SIP (UDP 5060)
; ============================

[transport-udp]
type=transport
protocol=udp
bind=0.0.00.:5066
external_signaling_address=192.168.1.101
external_media_address=192.168.1.101


; ==================================================
; UTILISATEUR SIP : Linphone (myuser2)
; ==================================================

[myuser2]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw
allow=gsm

auth=myuser2
aors=myuser2

direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes


[myuser2]
type=auth
auth_type=userpass
username=myuser2
password=tester


[myuser2]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30


; ==================================================
; GSM via osmo-sip-connector (IN + OUT)
; ==================================================

[GSM]
type=endpoint
transport=transport-udp
context=gsmsubscriber
disallow=all
allow=gsm
aors=GSM
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes


[GSM]
type=aor
contact=sip:127.0.0.1:5061
qualify_frequency=30


[GSM]
type=identify
endpoint=GSM
match=127.0.0.1/32
