; =============================================================================
; pjsip.conf — Asterisk PJSIP — Opérateur __OPERATOR_ID__
; IP container  : __CONTAINER_IP__
; IP inter-net  : __INTER_LOCAL_IP__   (réseau gsm-inter, pour trunks inter-op)
;
; Plan de numérotation :
;   100          Linphone A (softphone local)
;   200          Linphone B (softphone local)
;   600          Echo test
;   1XXXX        Abonnés GSM opérateur 1  (ex: 10001)
;   2XXXX        Abonnés GSM opérateur 2  (ex: 20001)
;   9XXXXX       Sortie inter-opérateur   (9 + numéro complet)
;
; Flux d'appels :
;   MS → Asterisk via MNCC socket (/tmp/msc_mncc) → OsmoMSC → context gsm_in
;   Linphone → Asterisk SIP → context internal
;   Inter-op  → trunk SIP sur gsm-inter → context interop_in
; =============================================================================

[global]
type=global
user_agent=OsmoAsterisk-Op__OPERATOR_ID__
; Logs Wireshark : activer la capture SIP avec
;   wireshark -k -i any -f "tcp port 5060 or udp port 5060 or udp port 4729"

; =============================================================================
; TRANSPORTS
; =============================================================================

; Transport principal (Linphone, MSC local, trunks inter-op)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; =============================================================================
; SOFTPHONE LOCAL A  (Linphone / Baresip / autre)
; SIP account : linphone_A@__CONTAINER_IP__:5060
; Mot de passe : tester
; Numéro       : 100
; =============================================================================

[linphone_A]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw
allow=gsm
auth=linphone_A
aors=linphone_A
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
callerid=Linphone A <100>

[linphone_A]
type=auth
auth_type=userpass
username=linphone_A
password=tester

[linphone_A]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; =============================================================================
; SOFTPHONE LOCAL B  (second softphone local)
; SIP account : linphone_B@__CONTAINER_IP__:5060
; Mot de passe : testerB
; Numéro       : 200
; =============================================================================

[linphone_B]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw
allow=gsm
auth=linphone_B
aors=linphone_B
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
callerid=Linphone B <200>

[linphone_B]
type=auth
auth_type=userpass
username=linphone_B
password=testerB

[linphone_B]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; =============================================================================
; TRUNK GSM ← OsmoMSC
; Le connecteur SIP d'OsmoMSC (osmo-sip-connector ou mncc-sock) envoie les
; appels GSM entrants depuis 127.0.0.1:5061.
; Contexte d'arrivée : gsm_in
; =============================================================================

[gsm_msc-identify]
type=identify
endpoint=gsm_msc
match=127.0.0.1

[gsm_msc]
type=endpoint
transport=transport-udp
context=gsm_in
disallow=all
allow=gsm
allow=ulaw
aors=gsm_msc
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[gsm_msc]
type=aor
contact=sip:127.0.0.1:5061
qualify_frequency=0

; =============================================================================
; TRUNK INTER-OPÉRATEUR → Opérateur distant
; Utilise le réseau gsm-inter (172.20.0.0/24) commun à tous les opérateurs.
; __INTEROP_TRUNK_IP__ = IP inter-net de l'opérateur distant
;   Op1 → Op2 : 172.20.0.12
;   Op2 → Op1 : 172.20.0.11
;   OpN → OpM : 172.20.0.(10+M)
;
; Pour ajouter un 3ème opérateur : dupliquer ce bloc avec un nom distinct
; (ex: interop_op3) et adapter l'IP.
;
; Appels sortants : contexte interop_out (dial 9 + numéro)
; Appels entrants : contexte interop_in
; =============================================================================

; Identification des appels entrants depuis l'opérateur distant
[interop-identify]
type=identify
endpoint=interop_trunk
match=__INTEROP_TRUNK_IP__

[interop_trunk]
type=endpoint
transport=transport-udp
context=interop_in
disallow=all
allow=ulaw
allow=gsm
aors=interop_trunk
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[interop_trunk]
type=auth
auth_type=userpass
username=interop_op__OPERATOR_ID__
password=interop_secret

[interop_trunk]
type=aor
; IP de l'Asterisk distant sur le réseau inter
contact=sip:__INTEROP_TRUNK_IP__:5060
qualify_frequency=15
