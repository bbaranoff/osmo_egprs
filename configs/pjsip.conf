; =============================================================================
; pjsip.conf — Asterisk PJSIP — Opérateur __OPERATOR_ID__
;
; IP container  : __CONTAINER_IP__   (réseau privé gsm-net-opN)
; IP inter-net  : __INTER_LOCAL_IP__ (réseau backbone gsm-inter 172.20.0.0/24)
;
; NOTES D'ARCHITECTURE
; ────────────────────
; • Les trunks inter-opérateurs (interop_trunk_op1, interop_trunk_op2…)
;   NE SONT PAS définis ici : ils sont générés et APPENDÉS dynamiquement
;   par generate_pjsip_interop_trunks() dans start.sh.
;   Pour N opérateurs, start.sh génère N-1 trunks (excluant l'opérateur actuel).
;
; • Pour les appels MO (GSM → Asterisk via osmo-sip-connector) :
;     osmo-sip-connector envoie depuis 127.0.0.1:5060 → identifié par
;     gsm_msc-identify → contexte gsm_in.
;
; • Pour les appels MT (Asterisk → MSC) :
;     Asterisk envoie vers le contact de l'AOR gsm_msc
;     (sip:127.0.0.1:5061 = port osmo-sip-connector).
;
; • Variables substituées par start.sh :
;     __OPERATOR_ID__    → ID opérateur (1, 2, 3, ...)
;     __CONTAINER_IP__   → 127.0.0.1
;     __INTER_LOCAL_IP__ → 172.20.0.11, 172.20.0.12, ...
; =============================================================================

[global]
type=global
user_agent=OsmoAsterisk-Op__OPERATOR_ID__

; =============================================================================
; TRANSPORT
; =============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; =============================================================================
; SOFTPHONE LOCAL A
; Compte SIP : linphone_A / tester  →  numéro 100
; =============================================================================

[linphone_A]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw
allow=alaw
allow=gsm
auth=linphone_A
aors=linphone_A
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
callerid=Linphone A <100>

[linphone_A]
type=auth
auth_type=userpass
username=linphone_A
password=tester

[linphone_A]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

; =============================================================================
; SOFTPHONE LOCAL B
; Compte SIP : linphone_B / testerB  →  numéro 200
; =============================================================================

[linphone_B]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw
allow=alaw
allow=gsm
auth=linphone_B
aors=linphone_B
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
callerid=Linphone B <200>

[linphone_B]
type=auth
auth_type=userpass
username=linphone_B
password=testerB

[linphone_B]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

; =============================================================================
; SOFTPHONE LOCAL C
; Compte SIP : linphone_C / testerC  →  numéro 300
; =============================================================================

[linphone_C]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw
allow=alaw
allow=gsm
auth=linphone_C
aors=linphone_C
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
callerid=Linphone C <300>

[linphone_C]
type=auth
auth_type=userpass
username=linphone_C
password=testerC

[linphone_C]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

; =============================================================================
; TRUNK GSM ← OsmoMSC (via osmo-sip-connector)
;
; osmo-sip-connector se connecte depuis 127.0.0.1.
; Il écoute sur le port 5061 pour les appels MT sortants d'Asterisk.
;
; Identification des appels MO entrants : gsm_msc-identify (match 127.0.0.1)
; Contexte d'arrivée : gsm_in (voir extensions.conf)
;
; CODEC : osmo-sip-connector utilise GSM FR → allow=gsm en priorité.
;         ulaw/alaw en fallback pour la compatibilité transcoder.
; =============================================================================

[gsm_msc-identify]
type=identify
endpoint=gsm_msc
match=127.0.0.1

[gsm_msc]
type=endpoint
transport=transport-udp
context=gsm_in
disallow=all
allow=gsm
allow=ulaw
allow=alaw
aors=gsm_msc
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
from_user=asterisk_op__OPERATOR_ID__

[gsm_msc]
type=aor
; Contact vers lequel Asterisk envoie les appels MT (Linphone→MS, MS→MS)
; Port 5061 = port d'écoute SIP d'osmo-sip-connector
contact=sip:127.0.0.1:5061
; qualify désactivé pour éviter les OPTIONS non-stop vers le connector
qualify_frequency=10

; =============================================================================
; TRUNKS INTER-OPÉRATEURS
;
; Les trunks vers les autres opérateurs sont GÉNÉRÉS DYNAMIQUEMENT
; et APPENDÉS à cette config par start.sh:generate_pjsip_interop_trunks()
;
; Pour N opérateurs, N-1 trunks sont générés (on exclut l'opérateur courant)
;
; Format généré pour chaque opérateur distant i (où i ≠ __OPERATOR_ID__):
;
;   [interop-identify-opi]
;   type=identify
;   endpoint=interop_trunk_opi
;   match=172.20.0.(10+i)
;
;   [interop_trunk_opi]
;   type=endpoint
;   transport=transport-udp
;   context=interop_in
;   disallow=all
;   allow=gsm
;   allow=ulaw
;   allow=alaw
;   aors=interop_trunk_opi
;   direct_media=no
;   rtp_symmetric=yes
;   force_rport=yes
;   rewrite_contact=yes
;   from_user=interop_op__OPERATOR_ID__
;
;   [interop_trunk_opi]
;   type=aor
;   contact=sip:172.20.0.(10+i):5060
;   qualify_frequency=15
;   qualify_timeout=5.0
;
; Exemple avec 3 opérateurs (Op1, Op2, Op3) :
;   - Op1 génère trunks vers Op2 et Op3 (2 trunks)
;   - Op2 génère trunks vers Op1 et Op3 (2 trunks)
;   - Op3 génère trunks vers Op1 et Op2 (2 trunks)
; =============================================================================
