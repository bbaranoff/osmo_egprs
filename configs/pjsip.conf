; =========================================================
; Asterisk PJSIP configuration
; MACHINE A
; IP locale : 192.168.56.101
; =========================================================

[global]
type=global
user_agent=TP-Asterisk-PJSIP


; =========================================================
; TRANSPORT SIP PRINCIPAL (Linphone + trunks)
; =========================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=192.168.56.101
external_media_address=192.168.56.101


; =========================================================
; UTILISATEUR SIP LOCAL — LINPHONE A
; =========================================================

[linphone_A]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw
allow=gsm

auth=linphone_A
aors=linphone_A

direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes


[linphone_A]
type=auth
auth_type=userpass
username=linphone_A
password=tester


[linphone_A]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30


; =========================================================
; TRUNK SIP VERS MACHINE B
; =========================================================
; Machine B : 192.168.56.102
; Tous les appels venant de B arrivent en [from_remote]
; =========================================================

[remote_ast]
type=endpoint
transport=transport-udp
context=from_remote
disallow=all
allow=ulaw
allow=gsm

aors=remote_ast

direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[remote_ast-identify]
type=identify
endpoint=remote_ast
match=192.168.56.102


[remote_ast]
type=aor
contact=sip:192.168.56.102:5060
qualify_frequency=30


; =========================================================
; TRUNK SIP GSM — OSMO MSC / sip-connector
; =========================================================
; GSM → Asterisk
; Tous les appels GSM entrent en [gsm_subscriber]
; =========================================================

[gsm_msc-identify]
type=identify
endpoint=gsm_msc
match=127.0.0.1


[gsm_msc]
type=endpoint
transport=transport-udp
context=gsm_subscriber
disallow=all
allow=gsm
allow=ulaw

aors=gsm_msc

direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes


[gsm_msc]
type=aor
contact=sip:127.0.0.1:5061
qualify_frequency=30
