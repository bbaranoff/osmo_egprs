; =============================================================================
; pjsip.conf — Asterisk PJSIP — Opérateur __OPERATOR_ID__
;
; Linphone depuis l'hôte :
;   Direct : __INTER_LOCAL_IP__:5060  (Docker bridge)
;   Mappé  : __HOST_IP__:__SIP_HOST_PORT__
;   linphone_A / tester → 100  |  linphone_B / testerB → 200
; =============================================================================

[global]
type=global
user_agent=OsmoAsterisk-Op__OPERATOR_ID__

; =============================================================================
; TRANSPORT
; =============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=__INTER_LOCAL_IP__
external_signaling_address=__INTER_LOCAL_IP__
local_net=127.0.0.0/8
local_net=172.20.0.0/16
local_net=10.0.0.0/8

; =============================================================================
; LINPHONE A — numéro 100
; =============================================================================

[linphone_A]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw
allow=gsm
auth=linphone_A
aors=linphone_A
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=no
callerid=Linphone A <100>

[linphone_A]
type=auth
auth_type=userpass
username=linphone_A
password=tester

[linphone_A]
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=30
qualify_timeout=5.0

; =============================================================================
; LINPHONE B — numéro 200
; =============================================================================

[linphone_B]
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=ulaw
allow=gsm
auth=linphone_B
aors=linphone_B
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=no
callerid=Linphone B <200>

[linphone_B]
type=auth
auth_type=userpass
username=linphone_B
password=testerB

[linphone_B]
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=30
qualify_timeout=5.0

; =============================================================================
; TRUNK GSM ← OsmoMSC via osmo-sip-connector (127.0.0.1:5061)
;
; media_encryption=no : CRITIQUE — osmo-sip-connector envoie du RTP brut,
;   pas du SRTP/DTLS. Sans cette option Asterisk peut interpréter certains
;   paquets RTP comme du DTLS → "Received SSL traffic without SSL session"
;   → audio jeté → pas de son.
; =============================================================================

[gsm_msc-identify]
type=identify
endpoint=gsm_msc
match=127.0.0.1

[gsm_msc]
type=endpoint
transport=transport-udp
context=gsm_in
disallow=all
allow=gsm
allow=ulaw
aors=gsm_msc
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=no
dtls_auto_generate_cert=no

[gsm_msc]
type=aor
contact=sip:127.0.0.1:5061
qualify_frequency=10

; =============================================================================
; TRUNKS INTER-OPÉRATEURS — GÉNÉRÉ par start.sh
; =============================================================================
